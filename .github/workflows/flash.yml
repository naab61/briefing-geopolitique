name: FLASH TREND RADAR

on:
  workflow_dispatch:

jobs:
  flash:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérification X
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import urllib.error

          token = "".join(os.environ.get("X_BEARER_TOKEN", "").split())

          url = "https://api.x.com/2/tweets/search/recent?query=-is%3Aretweet&max_results=10"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + token,
                  "User-Agent": "FlashTrendRadar/12.0"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("X TEST :", response.status)
                  print("X Recent Search : OK")
                  print(response.read().decode("utf-8")[:500])
          except urllib.error.HTTPError as e:
              print("X TEST :", e.code)
              print("X Recent Search : REFUSÉ")
              print(e.read().decode("utf-8")[:1000])
          PY
      - name: Exécuter FLASH
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python flash.py
