name: Flash geopolitique

on:
  schedule:
    - cron: '*/5 * * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flash:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_FLASH_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_FLASH_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Run flash
        run: python flash.py

      - name: Save flash state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flash_seen.json
          git diff --cached --quiet || git commit -m "Update flash state"
          git push
