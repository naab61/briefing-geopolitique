name: FLASH TREND RADAR

on:
  workflow_dispatch:

jobs:
  flash:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérification X
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python - <<'PY'
          import os
          t = os.environ.get("X_BEARER_TOKEN", "")

          print("Longueur :", len(t))

          propre = "".join(c for c in t if not c.isspace())

          print("Longueur après suppression des espaces :", len(propre))

          for i, c in enumerate(propre):
              if not (c.isascii() and c.isprintable()):
                  print("Caractère invalide après nettoyage à la position :", i)
                  print("Type :", repr(c))
                  print("Code Unicode :", ord(c))
                  print("Nom Unicode :", __import__("unicodedata").name(c, "INCONNU"))
          PY

      - name: Exécuter FLASH
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python flash.py
